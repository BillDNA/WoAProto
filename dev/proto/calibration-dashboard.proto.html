<title>Iteration Workbench</title>
<!-- PROTOTYPE — throwaway. Wayfinder #91, v3 (Bill's steer round 2):
     Plan: drop "held fixed", light-touch accept settings (pending Temperature spec #93).
     Run: "over the playtester's shoulder" — live match feed + anomaly signals, not just a progress bar.
     Results: one-pager stays the main view; full balance + feels reports NEST underneath (native <details>).
     Switch phase: bottom bar or ?phase=plan|run|results. Mock data — NOT a live run. -->
<style>
  :root{
    --paper:#f4f3ec; --card:#fbfaf5; --sunk:#efeee5; --ink:#1b1d17; --ink-2:#4a4d40; --ink-3:#8a8c7c;
    --line:#dedbcd; --line-2:#cbc8b6;
    --accent:#3f6d8a; --accent-ink:#2c556e; --accent-wash:#3f6d8a18;
    --good:#4e7a4a; --good-wash:#4e7a4a1f;
    --nudge:#b8851f; --nudge-wash:#c8922a22;
    --crit:#a8432f; --crit-wash:#a8432f1c;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --disp:'Archivo','IBM Plex Sans',system-ui,sans-serif;
    --r:9px; --shadow:0 1px 2px #1b1d1710,0 6px 20px #1b1d1708;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#14150f; --card:#1c1e16; --sunk:#191b13; --ink:#eceadb; --ink-2:#a7a898; --ink-3:#71735f;
      --line:#2c2e23; --line-2:#3a3c2f;
      --accent:#78aecb; --accent-ink:#9cc6de; --accent-wash:#78aecb1c;
      --good:#8bc286; --good-wash:#8bc28620; --nudge:#e0ad4a; --nudge-wash:#e0ad4a22;
      --crit:#e08066; --crit-wash:#e0806622; --shadow:0 1px 2px #0006,0 8px 24px #0004;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14150f; --card:#1c1e16; --sunk:#191b13; --ink:#eceadb; --ink-2:#a7a898; --ink-3:#71735f;
    --line:#2c2e23; --line-2:#3a3c2f;
    --accent:#78aecb; --accent-ink:#9cc6de; --accent-wash:#78aecb1c;
    --good:#8bc286; --good-wash:#8bc28620; --nudge:#e0ad4a; --nudge-wash:#e0ad4a22;
    --crit:#e08066; --crit-wash:#e0806622; --shadow:0 1px 2px #0006,0 8px 24px #0004;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:78px}
  h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;font-weight:640;letter-spacing:-.01em}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 24px}
  button{font-family:var(--sans);cursor:pointer} a{color:var(--accent-ink)}
  .muted{color:var(--ink-2)} .barnote{font-family:var(--mono);font-size:11px;color:var(--ink-2)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
  .pill.good{color:var(--good);background:var(--good-wash);border-color:transparent}
  .pill.nudge{color:var(--nudge);background:var(--nudge-wash);border-color:transparent}
  .pill.crit{color:var(--crit);background:var(--crit-wash);border-color:transparent}
  .pill.accent{color:var(--accent-ink);background:var(--accent-wash);border-color:transparent}
  .btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:13px;font-weight:560}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0e1410}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.crit{border-color:var(--crit);color:var(--crit)} .btn.good{border-color:var(--good);color:var(--good)}
  .btn.big{padding:11px 20px;font-size:14px}

  .vhead{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .vhead .sub{color:var(--ink-2);font-size:13px;max-width:62ch;margin-top:5px}
  .sectlabel{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
  .sectlabel h2{font-size:15px} .sectlabel .eyebrow{margin-left:auto}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:none} .kv .k{color:var(--ink-2)}
  .row{display:flex;gap:16px;flex-wrap:wrap} .col{flex:1;min-width:270px}

  /* PLAN */
  .looptypes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .lt{border:1.5px solid var(--line-2);border-radius:var(--r);padding:15px;cursor:pointer;background:var(--card);transition:.12s;position:relative}
  .lt:hover{border-color:var(--accent)}
  .lt.on{border-color:var(--accent);background:var(--accent-wash)}
  .lt.off{opacity:.62}
  .lt .ic{font-size:20px;line-height:1} .lt h3{font-size:15px;margin:8px 0 3px} .lt p{margin:0;font-size:12px;color:var(--ink-2)}
  .lt .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-top:8px}
  .lt .held{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
  .nudge-in{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--sans);font-size:14px;padding:11px 13px;resize:vertical;min-height:64px}
  .nudge-in:focus{outline:2px solid var(--accent);border-color:transparent}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .chip{font-size:12px;padding:4px 11px;border-radius:999px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2)}
  .chip:hover{border-color:var(--accent);color:var(--accent-ink)}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .seg button{background:var(--card);border:none;padding:6px 13px;font-family:var(--mono);font-size:12px;color:var(--ink-2);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .seg button.on,:root:not([data-theme="light"]) .seg button.on{color:#0e1410}
  .graceaxes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .pend{border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px;background:transparent}
  .qitem{display:flex;gap:9px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .qitem .mono{flex:none;color:var(--ink-2);width:52px}
  .qitem input{flex:1;background:transparent;border:none;color:var(--ink);font:inherit}
  .qitem input:focus{outline:none;border-bottom:1px solid var(--accent)}

  /* RUN — shoulder view */
  .livedot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #3f6d8a66}70%{box-shadow:0 0 0 8px #3f6d8a00}100%{box-shadow:0 0 0 0 #3f6d8a00}}
  @media (prefers-reduced-motion:reduce){.livedot{animation:none}}
  .progstrip{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .prog{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden;border:1px solid var(--line);flex:1;min-width:180px}
  .prog>i{display:block;height:100%;background:var(--accent);border-radius:6px}

  .nowplaying{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .nowplaying .badge{font-family:var(--mono);font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
  .feed{display:flex;flex-direction:column;gap:0}
  .turn{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .turn:last-child{border-bottom:none}
  .turn .tn{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:right;padding-top:1px}
  .turn .mv{font-size:13px;font-weight:560}
  .turn .say{font-size:13px;color:var(--ink-2);margin-top:3px;font-style:italic;position:relative;padding-left:12px}
  .turn .say::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:2px;background:var(--accent);border-radius:2px;opacity:.5}
  .turn.flag .mv{color:var(--nudge)}
  .turn.flag .say::before{background:var(--nudge);opacity:1}

  .signals{display:flex;flex-direction:column;gap:9px}
  .sig{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:8px;border:1px solid var(--line)}
  .sig.warn{background:var(--nudge-wash);border-color:transparent}
  .sig.crit{background:var(--crit-wash);border-color:transparent}
  .sig.ok{background:var(--good-wash);border-color:transparent}
  .sig .ic{flex:none;font-family:var(--mono)}
  .sig .tx{font-size:13px} .sig .tx b{font-weight:600}
  .sig .act{margin-left:auto;flex:none}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .statgrid>div{background:var(--card);padding:12px 14px}
  .statgrid .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
  .statgrid .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:3px}
  .logtail{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-family:var(--mono);font-size:12px;line-height:1.7;max-height:190px;overflow:auto}
  .logtail .t{color:var(--ink-3)} .logtail .ok{color:var(--good)}
  details{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:14px;overflow:hidden}
  details>summary{cursor:pointer;padding:13px 16px;font-family:var(--disp);font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:9px}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:'▸';color:var(--accent-ink);font-size:12px;transition:.15s}
  details[open]>summary::before{transform:rotate(90deg)}
  details>summary .eyebrow{margin-left:auto}
  details .body{padding:0 16px 16px}

  /* RESULTS */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .summary>div{background:var(--card);padding:15px 16px}
  .summary .big{font-family:var(--mono);font-size:24px;font-weight:600}
  .summary .lab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-top:2px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .gcard{border:1px solid var(--line-2);border-radius:11px;background:linear-gradient(180deg,var(--card),var(--sunk));padding:13px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
  .gcard .verdict{position:absolute;top:0;right:0;font-family:var(--mono);font-size:10px;padding:3px 9px;border-bottom-left-radius:8px;text-transform:uppercase;letter-spacing:.06em}
  .verdict.keep{background:var(--good-wash);color:var(--good)} .verdict.cut{background:var(--crit-wash);color:var(--crit)} .verdict.iter{background:var(--nudge-wash);color:var(--nudge)}
  .gcard .top{display:flex;align-items:center;gap:8px;padding-right:56px}
  .gcard .cost{font-family:var(--mono);font-weight:700;font-size:15px;background:var(--ink);color:var(--paper);width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
  .gcard .nm{font-family:var(--disp);font-weight:640;font-size:15px;line-height:1.1}
  .gcard .type{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
  .gcard .txt{font-size:12.5px;color:var(--ink-2);min-height:34px}
  .gcard .diff{font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent-wash);border-radius:6px;padding:5px 8px}
  .gcard .ev{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
  .gcard .ev .m{font-family:var(--mono);font-size:11px;color:var(--ink-2)} .gcard .ev .m b{color:var(--ink)}
  .new-badge{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:4px;letter-spacing:.06em}
  :root[data-theme="dark"] .new-badge,:root:not([data-theme="light"]) .new-badge{color:#0e1410}
  .mapcard{border:1px solid var(--line-2);border-radius:11px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
  .mapthumb{background:var(--sunk);display:grid;place-items:center;padding:12px;border-bottom:1px solid var(--line)}
  .mapmeta{padding:12px 13px;display:flex;flex-direction:column;gap:7px}
  .mapmeta .nm{font-family:var(--disp);font-weight:640;font-size:15px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line-2);font-weight:500}
  th.l,td.l{text-align:left}
  td{padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .arrow{color:var(--ink-3)} .up{color:var(--good)} .down{color:var(--crit)} .pos{color:var(--good)} .neg{color:var(--crit)}
  .tableScroll{overflow-x:auto}
  .feels{display:flex;flex-direction:column;gap:12px}
  .feelblk{border-left:2px solid var(--accent);padding:2px 0 2px 13px}
  .feelblk .q{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
  .feelblk .a{font-size:13.5px;margin-top:2px}

  /* phase switcher */
  #switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;background:var(--ink);color:var(--paper);border-radius:999px;padding:5px 6px;box-shadow:0 8px 30px #0003,0 2px 6px #0004}
  #switch button{background:transparent;border:none;color:var(--paper);opacity:.6;padding:7px 16px;border-radius:999px;font-family:var(--mono);font-size:12.5px}
  #switch button:hover{opacity:.85} #switch button.on{opacity:1;background:#ffffff1f}
  #switch button.on b{color:#fff} #switch .step{font-family:var(--mono);opacity:.35;font-size:12px}
  #themeBtn{position:fixed;right:18px;top:18px;z-index:50}
</style>

<button class="btn ghost" id="themeBtn" onclick="toggleTheme()">◐ theme</button>
<div class="wrap" id="app"></div>

<div id="switch">
  <button data-p="plan" onclick="goPhase('plan')"><b>1</b> Plan</button><span class="step">→</span>
  <button data-p="run" onclick="goPhase('run')"><b>2</b> Run</button><span class="step">→</span>
  <button data-p="results" onclick="goPhase('results')"><b>3</b> Results</button>
</div>

<script>
/* ================= mock data (grounded shapes; NOT a live run) ================= */
const RUN={loop:'Card loop', nudge:'Reward committing to an early cavalry push — the midgame feels too safe.',
  deck:'cavsplit17-raid-paid', mapset:'core7', panel:'brawler · turtle · hawk',
  iter:4, iters:6, skirm:1740, skirmTotal:6000};

const QUESTIONNAIRE=[
  {id:'feel',text:'Did the match feel fair, or lopsided from the opening?'},
  {id:'reflex',text:'Where were your plays real choices vs. reflex / only-legal-move?'},
  {id:'arc',text:'Name the turn the game tipped, if it did.'},
  {id:'blind',text:'Anything the AI seemed to miss that you could see? (blind-spot flag)'}];
const GRACE=[{k:'win%',g:'nudge'},{k:'HQ%',g:'hold'},{k:'Drag',g:'bold'},{k:'Swings',g:'bold'},{k:'resid',g:'nudge'}];

/* RUN: over-the-shoulder — one live skirmish, the playtester talking as it plays */
const LIVE={candidate:'Flanking Order', map:'Split Ford', turn:7, turns:12,
  feed:[ // newest first
   {t:7, mv:'Red — Deploy Cavalry → (0,−1)', say:'extending the wing, but I still have no lane for Flanking Order'},
   {t:6, mv:'Red — held Flanking Order (declined)', say:'no enemy adjacent again; this card keeps asking for a board I don’t have', flag:true},
   {t:5, mv:'Blue — Entrench at HQ', say:'blue is turtling early, daring me to over-commit'},
   {t:4, mv:'Red — Raiding Party behind lines', say:'this was the one real decision so far — worth the exposure'},
   {t:3, mv:'Red — held Flanking Order (declined)', say:'too early, nothing to flank', flag:true},
   {t:2, mv:'Blue — Deploy Artillery', say:'reads as a slow build; fine'},
   {t:1, mv:'Red — Deploy Infantry (start)', say:'standard open'}]};
const SIGNALS=[
  {sev:'warn', text:'<b>Flanking Order declined 6 of its last 8 offered turns</b> — the playtester can’t find a target. The new card may be too situational, or its trigger is too narrow.', act:'inspect card'},
  {sev:'warn', text:'<b>Split Ford: 2 zero-kill games</b> this iteration — check the crossings aren’t a stalemate.', act:'open map'},
  {sev:'ok', text:'Feels-notes are specific, not flat — the playtester is engaged, so the read is trustworthy.', act:null}];
const RUNLOG=[
  ['09:41','iter 4/6 · drafted','Flanking Order (6pt) — sweeping'],
  ['09:33','iter 3/6 · <span class="ok">kept</span>','Split Ford — Drag 2.5, Swings 3.8 ✓'],
  ['09:19','iter 2/6 · <span class="ok">cut</span>','Mass Assault — declined 55–70%'],
  ['09:12','iter 1/6 · start','loop armed · nudge locked · rules 1.2 golden']];

/* RESULTS: content built + nested reports */
const BUILT_CARDS=[
  {nm:'Flanking Order',cost:6,type:'maneuver',isNew:true,verdict:'iter',
   txt:'Move a Cavalry unit up to 2 hexes; if it ends adjacent to an enemy, it attacks free.',
   diff:'NEW — but declined 6/8; trigger likely too narrow',ev:[['resid','+0.7'],['win','54%'],['seen','23%']]},
  {nm:'Raiding Party',cost:6,type:'maneuver',isNew:false,verdict:'keep',
   txt:'Deploy a Cavalry unit behind enemy lines; it cannot be reinforced this turn.',
   diff:'TUNED — +free-reposition, cost 5→6',ev:[['resid','+1.1→+0.4'],['win','58%→52%'],['seen','55%']]},
  {nm:'Reckless Maneuvers',cost:4,type:'maneuver',isNew:false,verdict:'keep',
   txt:'Move any two units; each ends its move exposed (−1 defense this round).',
   diff:'HELD — in-band, kept as control',ev:[['resid','−0.3'],['win','48%'],['seen','40%']]},
  {nm:'Mass Assault',cost:8,type:'attack',isNew:false,verdict:'cut',
   txt:'All adjacent units attack the same enemy hex simultaneously.',
   diff:'CUT — strictly-dominated, declined 55–70%',ev:[['resid','−2.3'],['win','43%'],['seen','44%']]}];
const BUILT_MAPS=[
  {nm:'Split Ford',shape:'river',verdict:'keep',drag:2.5,swings:3.8,note:'two crossings force a commit'},
  {nm:'The Pinch',shape:'choke',verdict:'iter',drag:3.1,swings:2.6,note:'too grindy — Drag over band'}];
const HEURISTICS=[
  {key:'advance',who:'hawk',from:2.2,to:2.9},{key:'hqGuard',who:'turtle',from:4,to:5.5},
  {key:'threatKill',who:'brawler',from:6,to:6,note:'held'},{key:'fallbackBias',who:'hawk',from:12,to:9},
  {key:'trenchHome',who:'turtle',from:6,to:7.5}];
const BALANCE=[ // the nested full balance report (what v1 wrongly led with)
  {k:'First-mover',cur:50,tgt:47,u:'%',in:true},{k:'Red win',cur:49,tgt:49,u:'%',in:true},
  {k:'HQ endings',cur:19,tgt:17,u:'%',in:true},{k:'Tie→2nd',cur:15,tgt:13,u:'%',in:true},
  {k:'Drag',cur:2.7,tgt:2.4,u:'',in:true},{k:'Swings',cur:3.6,tgt:3.5,u:'',in:true},
  {k:'Control',cur:91,tgt:93,u:'%',in:true},{k:'Zero-kill',cur:5,tgt:2,u:'%',in:false}];
const FEELS=[ // per-skirmish debrief, keyed to the questionnaire
  {sk:'seed 1001 · Split Ford', qa:[
    ['feel','Fair — blue’s turtle made the opening tense without feeling hopeless.'],
    ['reflex','Raiding Party behind the lines was a real read; the cavalry deploys were on-rails.'],
    ['arc','Turn 8 — the ford crossing traded and red never recovered tempo.'],
    ['blind','The AI left its artillery undefended twice; I’d have punished it if I could reach it.']]},
  {sk:'seed 1001 · The Pinch', qa:[
    ['feel','Lopsided late — once blue held the choke it was grind, not tension.'],
    ['reflex','Mostly reflex after turn 6; the map made the choices for me.'],
    ['arc','No clear tip — it was decided by the terrain, not a move.'],
    ['blind','Nothing missed; the position was just dry.']]}];

/* ================= helpers ================= */
function graceStrip(){const c={hold:'var(--ink-2)',nudge:'var(--nudge)',bold:'var(--accent-ink)',bypass:'var(--crit)'};
  return '<div class="graceaxes">'+GRACE.map(a=>`<span class="pill" style="color:${c[a.g]}">${a.k}·${a.g}</span>`).join('')+'</div>';}
function hexThumb(kind){const W=150,H=118,r=13,dx=r*Math.sqrt(3),dy=r*1.5;let cells=[];
  for(let row=0;row<5;row++)for(let col=0;col<4;col++){const x=18+col*dx+(row%2?dx/2:0),y=16+row*dy;
    if((row===0&&col===3)||(row===4&&col===0))continue;cells.push({x,y,row,col});}
  const hexPath=(cx,cy)=>{let p='';for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90);p+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)+' ';}return p+'Z';};
  const terr=kind==='river'?c=>((c.col===1&&c.row>0)?'var(--accent-wash)':null):c=>((c.col===1||c.col===2)&&c.row===2?'var(--nudge-wash)':null);
  const hexes=cells.map(c=>`<path d="${hexPath(c.x,c.y)}" fill="${terr(c)||'var(--card)'}" stroke="var(--line-2)" stroke-width="1"/>`).join('');
  const a=cells[0],b=cells[cells.length-1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="map outline">${hexes}<circle cx="${a.x}" cy="${a.y}" r="5" fill="var(--crit)"/><circle cx="${b.x}" cy="${b.y}" r="5" fill="var(--accent)"/></svg>`;}
const vpill={keep:['keep','keep'],cut:['cut','cut'],iter:['iter','iterate']};

/* ================= PHASE 1 — PLAN ================= */
function planPhase(){
  const lt=(ic,nm,desc,tag,on)=>`<div class="lt ${on?'on':'off'}" onclick="pickLoop(this)">
    ${on?'':'<span class="held">held</span>'}<div class="ic">${ic}</div><h3>${nm}</h3><p>${desc}</p><div class="tag">${tag}</div></div>`;
  return `
  <div class="vhead"><div><div class="eyebrow">War of Attrition · iteration workbench</div>
    <h1 style="font-size:26px">Plan the iteration</h1>
    <div class="sub">Pick the one content kind this loop iterates — the other two are held automatically. Point it with a nudge, sanity-check the accept settings, then hand it to the machine.</div></div></div>

  <div class="sectlabel"><h2>1 · What does this loop build?</h2><span class="eyebrow">one lever moves · the rest hold</span></div>
  <div class="looptypes">
    ${lt('🃏','Card loop','Draft / tune cards under the 72-pt cap.','builds cards',true)}
    ${lt('⬡','Map loop','Carve maps to fill a roster gap.','builds maps',false)}
    ${lt('◆','AI loop','Tune heuristic personality weights.','builds personalities',false)}
  </div>

  <div class="row" style="margin-top:20px">
    <div class="col card pad" style="flex:1.5">
      <div class="eyebrow">2 · Opening nudge</div>
      <p class="muted" style="margin:6px 0 10px">A directional steer the drafter starts from — this is where your taste enters the loop.</p>
      <textarea class="nudge-in">${RUN.nudge}</textarea>
      <div class="chips"><button class="chip">+ more aggression</button><button class="chip">+ reward defense</button><button class="chip">+ open the midgame</button><button class="chip">+ punish greed</button></div>
    </div>
    <div class="col card pad">
      <div class="eyebrow">Fixtures · what it plays over</div>
      <p class="muted" style="margin:6px 0 8px">The board the candidates are measured on. Swap to change what “good” is measured against.</p>
      <div class="kv"><span class="k">Deck</span><span class="mono">${RUN.deck}</span></div>
      <div class="kv"><span class="k">Map-set</span><span class="mono">${RUN.mapset}</span></div>
      <div class="kv"><span class="k">AI panel</span><span class="mono">${RUN.panel}</span></div>
    </div>
  </div>

  <div class="card pad" style="margin-top:16px;border-style:dashed">
    <div style="display:flex;align-items:baseline;gap:10px"><div class="eyebrow">3 · Accept settings</div>
      <span class="pill nudge" style="margin-left:auto">pending Temperature spec · #93</span></div>
    <p class="muted" style="margin:8px 0 12px">How strict the grader is and which axes this lever may move. Kept intentionally light — the real controls land with the Temperature/Tolerance data structure (#93), so this is a placeholder, not the final knobs.</p>
    <div class="row">
      <div class="col"><div class="barnote" style="margin-bottom:6px">Tolerance · band width</div>
        <div class="seg"><button>T0</button><button class="on">T1</button><button>T2</button></div></div>
      <div class="col"><div class="barnote" style="margin-bottom:6px">Temperature · per-axis grace</div>
        <div class="seg"><button>T0</button><button class="on">card-dev</button><button>custom…</button></div>${graceStrip()}</div>
    </div>
  </div>

  <div class="card pad" style="margin-top:16px">
    <div class="eyebrow">4 · Playtester debrief · asked after every skirmish (#85)</div>
    <div style="margin-top:8px">${QUESTIONNAIRE.map(q=>`<div class="qitem"><span class="mono">${q.id}</span><input value="${q.text}"></div>`).join('')}
      <button class="btn ghost" style="margin-top:9px;font-size:12px">+ add question</button></div>
  </div>

  <div style="display:flex;gap:12px;align-items:center;margin-top:20px">
    <button class="btn primary big" onclick="goPhase('run')">▶ Launch on the machine</button>
    <span class="barnote">6 iterations × 100-skirmish sweep + 1 LLM feels-match per candidate · seed 1001</span></div>`;
}

/* ================= PHASE 2 — RUN (over the shoulder) ================= */
function runPhase(){
  const pct=RUN.skirm/RUN.skirmTotal*100;
  const feed=LIVE.feed.map(f=>`<div class="turn ${f.flag?'flag':''}"><div class="tn">t${f.t}</div>
    <div><div class="mv">${f.mv}</div><div class="say">“${f.say}”</div></div></div>`).join('');
  const sig=SIGNALS.map(s=>`<div class="sig ${s.sev}"><span class="ic">${s.sev==='ok'?'✓':'⚠'}</span>
    <span class="tx">${s.text}</span>${s.act?`<button class="btn ghost act" style="font-size:12px;padding:5px 10px">${s.act}</button>`:''}</div>`).join('');
  return `
  <div class="vhead"><div><div class="eyebrow">War of Attrition · iteration workbench</div>
    <h1 style="font-size:26px;display:flex;align-items:center;gap:10px"><span class="livedot"></span> Watching the loop</h1>
    <div class="sub"><b>${RUN.loop}</b> · nudged “${RUN.nudge}” — the point of this screen is to <b>catch what’s not working</b> while it runs, not just watch a bar fill.</div></div>
    <div style="display:flex;gap:8px"><button class="btn ghost">⏸ pause</button><button class="btn crit">■ stop</button></div></div>

  <div class="card pad" style="margin-bottom:16px"><div class="progstrip">
    <span class="mono" style="font-size:13px">iteration <b>${RUN.iter}/${RUN.iters}</b></span>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <span class="mono muted" style="font-size:12px">${RUN.skirm.toLocaleString()}/${RUN.skirmTotal.toLocaleString()} skirmishes · ~24 min left</span></div></div>

  <div class="sectlabel"><h2>⚠ Worth a look</h2><span class="eyebrow">auto-flagged anomalies · the “is this working?” read</span></div>
  <div class="signals">${sig}</div>

  <div class="sectlabel"><h2>Over the playtester’s shoulder</h2><span class="eyebrow">live skirmish · the LLM talking as it plays</span></div>
  <div class="card pad">
    <div class="nowplaying">
      <span class="pill accent">candidate · ${LIVE.candidate}</span>
      <span class="badge">map · ${LIVE.map}</span>
      <span class="badge">turn ${LIVE.turn}/${LIVE.turns}</span>
      <button class="btn ghost" style="margin-left:auto;font-size:12px">skip to next skirmish ↦</button></div>
    <div class="feed">${feed}</div>
  </div>

  <details><summary>Iteration log <span class="eyebrow">the debug trail</span></summary>
    <div class="body"><div class="logtail">${RUNLOG.map(l=>`<div><span class="t">${l[0]}</span> &nbsp;${l[1]} — ${l[2]}</div>`).join('')}</div></div></details>
  <p class="barnote" style="margin-top:12px">Writes every skirmish to <span class="mono">logs/woa.db</span>; the full report lands in Results when the loop finishes. Leave it running.</p>`;
}

/* ================= PHASE 3 — RESULTS (one-pager + nested reports) ================= */
function resultsPhase(){
  const cardEl=c=>{const [vk,vl]=vpill[c.verdict];return `<div class="gcard"><div class="verdict ${vk}">${vl}</div>
    <div class="top"><div class="cost">${c.cost}</div><div><div class="nm">${c.nm} ${c.isNew?'<span class="new-badge">new</span>':''}</div><div class="type">${c.type}</div></div></div>
    <div class="txt">${c.txt}</div><div class="diff">${c.diff}</div>
    <div class="ev">${c.ev.map(m=>`<span class="m">${m[0]} <b>${m[1]}</b></span>`).join('')}</div></div>`;};
  const mapEl=m=>{const [,vl]=vpill[m.verdict];const over=m.drag>3.0;return `<div class="mapcard">
    <div class="mapthumb">${hexThumb(m.shape)}</div><div class="mapmeta">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="nm">${m.nm}</span>
      <span class="pill ${m.verdict==='keep'?'good':'nudge'}">${vl}</span></div>
    <div class="muted" style="font-size:12.5px">${m.note}</div>
    <div style="display:flex;gap:8px"><span class="pill ${over?'crit':'good'}">Drag ${m.drag}</span><span class="pill">Swings ${m.swings}</span></div></div></div>`;};
  const heurRows=HEURISTICS.map(h=>{const d=h.to-h.from,cls=h.note?'':(d>0?'up':d<0?'down':'');
    return `<tr><td class="l mono">${h.key}</td><td class="l">${h.who}</td><td class="mono">${h.from}</td>
    <td class="arrow">→</td><td class="mono ${cls}">${h.note?'held':h.to}</td><td class="mono ${cls}">${h.note?'—':(d>0?'+':'')+d.toFixed(1)}</td></tr>`;}).join('');
  const balRows=BALANCE.map(m=>`<tr><td class="l">${m.k}</td><td class="mono">${m.cur}${m.u}</td>
    <td class="mono muted">${m.tgt}${m.u}</td><td>${m.in?'<span class="pill good">in-band</span>':'<span class="pill crit">out</span>'}</td></tr>`).join('');
  const feelsEl=FEELS.map(f=>`<div><div class="eyebrow" style="margin-bottom:8px">${f.sk}</div><div class="feels">
    ${f.qa.map(qa=>`<div class="feelblk"><div class="q">${qa[0]}</div><div class="a">“${qa[1]}”</div></div>`).join('')}</div></div>`).join('<div style="height:16px"></div>');
  return `
  <div class="vhead"><div><div class="eyebrow">War of Attrition · iteration workbench</div>
    <h1 style="font-size:26px">Results · iteration review</h1>
    <div class="sub"><b>${RUN.loop}</b> · nudged “${RUN.nudge}” · finished 10:05. The one-pager is the whole story at a glance; the numbers and transcripts nest below for a morning deep-dive.</div></div>
    <div style="display:flex;gap:8px"><button class="btn">↻ Re-run with edits</button></div></div>

  <div class="summary">
    <div><div class="big">1</div><div class="lab">card added</div></div>
    <div><div class="big">1</div><div class="lab">card tuned</div></div>
    <div><div class="big">1</div><div class="lab">card cut</div></div>
    <div><div class="big">1</div><div class="lab">map added</div></div>
    <div><div class="big">5</div><div class="lab">weights tuned</div></div>
    <div><div class="big" style="color:var(--nudge)">1</div><div class="lab">flag to review</div></div>
  </div>
  <p class="barnote" style="margin-top:8px">⚠ The new <b>Flanking Order</b> under-appeared (seen 23%) — carried over from the Run-phase flag; likely needs a wider trigger before it earns its slot.</p>

  <div class="sectlabel"><h2>Cards built</h2><span class="eyebrow">design first · evidence beneath</span></div>
  <div class="gallery">${BUILT_CARDS.map(cardEl).join('')}</div>

  <div class="sectlabel"><h2>Maps built</h2><span class="eyebrow">outline + feel read</span></div>
  <div class="gallery" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${BUILT_MAPS.map(mapEl).join('')}</div>

  <div class="sectlabel"><h2>Heuristic numbers</h2><span class="eyebrow">AI_WEIGHTS · before → after</span></div>
  <div class="card pad"><div class="tableScroll"><table>
    <thead><tr><th class="l">weight</th><th class="l">personality</th><th>from</th><th></th><th>to</th><th>Δ</th></tr></thead>
    <tbody>${heurRows}</tbody></table></div></div>

  <div class="sectlabel"><h2>Dig deeper</h2><span class="eyebrow">the reports, nested for the morning session</span></div>
  <details><summary>Balance report <span class="eyebrow">full metrics vs 1.2 baselines</span></summary>
    <div class="body"><div class="tableScroll"><table>
      <thead><tr><th class="l">metric</th><th>this run</th><th>target</th><th></th></tr></thead><tbody>${balRows}</tbody></table></div>
      <p class="barnote" style="margin-top:10px">This is the balance report — deliberately <b>nested</b>, not the front page. It’s evidence for the built content, not the point of the loop.</p></div></details>
  <details><summary>Feels reports <span class="eyebrow">per-skirmish playtester debriefs (#85)</span></summary>
    <div class="body" style="padding-top:14px">${feelsEl}</div></details>`;
}

/* ================= plumbing ================= */
const PHASES={plan:planPhase,run:runPhase,results:resultsPhase};
function curPhase(){const p=new URLSearchParams(location.search).get('phase');return PHASES[p]?p:'plan';}
function render(){const p=curPhase();document.getElementById('app').innerHTML=PHASES[p]();
  document.querySelectorAll('#switch button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));scrollTo(0,0);}
function goPhase(p){const u=new URL(location);u.searchParams.set('phase',p);history.replaceState(null,'',u);render();}
function pickLoop(el){el.parentElement.querySelectorAll('.lt').forEach(x=>{x.classList.remove('on');x.classList.add('off');
  const h=x.querySelector('.held');if(!h){const s=document.createElement('span');s.className='held';s.textContent='held';x.prepend(s);}});
  el.classList.add('on');el.classList.remove('off');const h=el.querySelector('.held');if(h)h.remove();}
function toggleTheme(){const r=document.documentElement;
  const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');}
addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const o=['plan','run','results'],i=o.indexOf(curPhase());
  if(e.key==='ArrowLeft')goPhase(o[(i+2)%3]);if(e.key==='ArrowRight')goPhase(o[(i+1)%3]);});
render();
</script>
