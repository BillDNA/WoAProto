<title>Calibration Cockpit</title>
<!-- PROTOTYPE — throwaway. Wayfinder #91: "how should the calibration dashboard + content-loop kickoff look?"
     3 structurally-different variants, switch with the floating bar or ?variant=A|B|C.
     Mock data grounded in real report-model fields (resid, points, seen, decline-rate, capability class) — NOT a live run. -->
<style>
  :root{
    --paper:#f4f3ec; --card:#fbfaf5; --ink:#1b1d17; --ink-2:#4a4d40; --ink-3:#73766650;
    --line:#dedbcd; --line-2:#cbc8b6;
    --accent:#3f6d8a; --accent-ink:#2c556e; --accent-wash:#3f6d8a18;
    --good:#4e7a4a; --good-wash:#4e7a4a1f;
    --nudge:#b8851f; --nudge-wash:#c8922a22;
    --crit:#a8432f; --crit-wash:#a8432f1c;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --disp:'Archivo','IBM Plex Sans',system-ui,sans-serif;
    --r:9px; --shadow:0 1px 2px #1b1d1710,0 6px 20px #1b1d1708;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#14150f; --card:#1c1e16; --ink:#eceadb; --ink-2:#a7a898; --ink-3:#6a6c5c55;
      --line:#2c2e23; --line-2:#3a3c2f;
      --accent:#78aecb; --accent-ink:#9cc6de; --accent-wash:#78aecb1c;
      --good:#8bc286; --good-wash:#8bc28620;
      --nudge:#e0ad4a; --nudge-wash:#e0ad4a22;
      --crit:#e08066; --crit-wash:#e0806622;
      --shadow:0 1px 2px #0006,0 8px 24px #0004;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14150f; --card:#1c1e16; --ink:#eceadb; --ink-2:#a7a898; --ink-3:#6a6c5c55;
    --line:#2c2e23; --line-2:#3a3c2f;
    --accent:#78aecb; --accent-ink:#9cc6de; --accent-wash:#78aecb1c;
    --good:#8bc286; --good-wash:#8bc28620;
    --nudge:#e0ad4a; --nudge-wash:#e0ad4a22;
    --crit:#e08066; --crit-wash:#e0806622;
    --shadow:0 1px 2px #0006,0 8px 24px #0004;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:76px}
  h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;font-weight:640;letter-spacing:-.01em}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px}
  button{font-family:var(--sans);cursor:pointer}
  a{color:var(--accent-ink)}

  /* shared atoms ---------------------------------------------------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
    padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
  .pill.good{color:var(--good);background:var(--good-wash);border-color:transparent}
  .pill.nudge{color:var(--nudge);background:var(--nudge-wash);border-color:transparent}
  .pill.crit{color:var(--crit);background:var(--crit-wash);border-color:transparent}
  .pill.accent{color:var(--accent-ink);background:var(--accent-wash);border-color:transparent}
  .cls{font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap}
  .cls.dom{color:var(--crit)} .cls.wdom{color:var(--nudge)} .cls.bal{color:var(--ink-2)}
  .cls.wdd{color:var(--accent-ink)} .cls.sdd{color:var(--accent-ink);opacity:.8}
  .btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:7px;font-size:13px;font-weight:560}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  :root[data-theme="dark"] .btn.primary,
  :root:not([data-theme="light"]) .btn.primary{color:#0e1410}
  .btn.ghost{background:transparent}
  .btn.crit{border-color:var(--crit);color:var(--crit)}
  .btn.good{border-color:var(--good);color:var(--good)}

  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-2);text-align:right;padding:7px 9px;border-bottom:1px solid var(--line-2);font-weight:500}
  th.l,td.l{text-align:left}
  td{padding:8px 9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  tr.flag td{background:var(--crit-wash)}
  .cardname{font-weight:560}
  .num{font-family:var(--mono)}
  .pos{color:var(--good)} .neg{color:var(--crit)}
  .tableScroll{overflow-x:auto}

  /* mini decline bar */
  .decl{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
  .decl i{width:6px;background:var(--accent);border-radius:1px 1px 0 0;opacity:.85;display:block}

  /* delta chip */
  .metric{display:flex;flex-direction:column;gap:3px}
  .metric .v{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1}
  .metric .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
  .metric .d{font-family:var(--mono);font-size:11px}
  .band{height:4px;border-radius:2px;margin-top:5px;background:var(--line)}
  .band>i{display:block;height:100%;border-radius:2px}

  .grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .grid-metrics>div{background:var(--card);padding:13px 14px}

  /* editable target */
  .tgt{font-family:var(--mono);border:1px dashed var(--line-2);background:transparent;color:var(--ink);
    width:46px;border-radius:5px;padding:2px 5px;font-size:12px;text-align:right}
  .tgt:focus{outline:2px solid var(--accent);border-color:transparent}

  /* cap meter */
  .cap{height:9px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
  .cap>i{display:block;height:100%}
  .cap.over>i{background:var(--crit)} .cap.ok>i{background:var(--good)}

  /* variant chrome */
  .vhead{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:baseline;justify-content:space-between;margin-bottom:20px}
  .vhead .sub{color:var(--ink-2);font-size:13px;max-width:52ch}
  section.blk{margin-bottom:18px;padding:18px}
  section.blk>.blkhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  section.blk>.blkhead h2{font-size:15px}
  section.blk>.blkhead .eyebrow{margin-left:auto}

  /* switcher */
  #switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;
    display:flex;align-items:center;gap:2px;background:var(--ink);color:var(--paper);
    border-radius:999px;padding:5px;box-shadow:0 8px 30px #0003,0 2px 6px #0004}
  #switch button{background:transparent;border:none;color:var(--paper);width:34px;height:34px;
    border-radius:999px;font-size:16px}
  #switch button:hover{background:#ffffff22}
  #switch .lbl{padding:0 14px;font-family:var(--mono);font-size:12.5px;white-space:nowrap;min-width:186px;text-align:center}
  #switch .lbl b{font-family:var(--disp);letter-spacing:.02em}
  #themeBtn{position:fixed;right:18px;top:18px;z-index:50}

  /* variant B wizard */
  .steps{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .steps .st{flex:1;padding:12px 14px;background:var(--card);border-right:1px solid var(--line);cursor:pointer}
  .steps .st:last-child{border-right:none}
  .steps .st .n{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .steps .st .t{font-family:var(--disp);font-weight:600;font-size:14px;margin-top:2px}
  .steps .st.on{background:var(--accent-wash)}
  .steps .st.on .t{color:var(--accent-ink)}
  .steps .st.done .n::after{content:' ✓';color:var(--good)}
  .stepPane{display:none} .stepPane.on{display:block}

  /* variant C diff */
  .diffgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .diffgrid>div{padding:14px 16px}
  .diffgrid .before{background:var(--crit-wash);border-right:1px solid var(--line)}
  .diffgrid .after{background:var(--good-wash)}
  .checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .checkrow:last-child{border-bottom:none}
  .checkrow .ic{width:18px;flex:none;text-align:center;font-family:var(--mono)}
  .ic.pass{color:var(--good)} .ic.warnic{color:var(--nudge)} .ic.failic{color:var(--crit)}

  .row{display:flex;gap:14px;flex-wrap:wrap}
  .col{flex:1;min-width:260px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv .k{color:var(--ink-2)}
  .muted{color:var(--ink-2)}
  .lever{display:flex;gap:8px;flex-wrap:wrap}
  .lever label{display:flex;gap:7px;align-items:center;border:1px solid var(--line-2);border-radius:7px;
    padding:8px 12px;cursor:pointer;font-size:13px}
  .lever input{accent-color:var(--accent)}
  .lever label.sel{border-color:var(--accent);background:var(--accent-wash)}
  .qitem{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .qitem .mono{flex:none;color:var(--ink-2)}
  .qitem input[type=text]{flex:1;background:transparent;border:none;color:var(--ink);font-size:13px;font-family:var(--sans)}
  .qitem input[type=text]:focus{outline:none;border-bottom:1px solid var(--accent)}
  .hold{opacity:.55}
  .barnote{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
</style>

<button class="btn ghost" id="themeBtn" onclick="toggleTheme()">◐ theme</button>
<div class="wrap" id="app"></div>

<div id="switch">
  <button onclick="cycle(-1)" aria-label="previous">‹</button>
  <div class="lbl" id="swlabel"></div>
  <button onclick="cycle(1)" aria-label="next">›</button>
</div>

<script>
/* ---------------- mock data (grounded in report-model fields) ---------------- */
// capability class per #82: DOM=single-card dominator(redesign flag), WDOM=weakly-dominant,
// BAL=balanced, WDD=weakly-dominated, SDD=strictly-dominated(redesign flag).
// decl = per-phase decline-rate % [Open, Mid, Late] from #89 in-hand-declined signal.
const CARDS = [
  {id:'deploy_inf_start', name:'Deploy Infantry',   pts:4, seen:100, resid:0.4,  cls:'BAL',  decl:null},
  {id:'conscription',     name:'Conscription',      pts:7, seen:58,  resid:2.6,  cls:'DOM',  decl:[4,9,15]},
  {id:'deploy_cavalry',   name:'Deploy Cavalry',    pts:6, seen:63,  resid:1.8,  cls:'WDOM', decl:[6,18,33]},
  {id:'raiding_party',    name:'Raiding Party',     pts:6, seen:55,  resid:1.1,  cls:'WDOM', decl:[10,20,30]},
  {id:'deploy_inf_trench',name:'Entrench',          pts:5, seen:66,  resid:0.9,  cls:'WDOM', decl:[8,22,40]},
  {id:'careful_maneuvers',name:'Careful Maneuvers', pts:4, seen:52,  resid:0.6,  cls:'BAL',  decl:[15,26,38]},
  {id:'forced_march',     name:'Forced March',      pts:5, seen:47,  resid:0.3,  cls:'BAL',  decl:[24,32,44]},
  {id:'attack_plus1',     name:'Attack +1',         pts:5, seen:49,  resid:0.2,  cls:'BAL',  decl:[20,30,45]},
  {id:'reckless_maneuvers',name:'Reckless Maneuvers',pts:4,seen:38,  resid:-0.8, cls:'WDD',  decl:[40,44,52]},
  {id:'naval_barrage',    name:'Naval Barrage',     pts:9, seen:41,  resid:-1.5, cls:'WDD',  decl:[33,48,66]},
  {id:'deploy_artillery', name:'Deploy Artillery',  pts:6, seen:71,  resid:-1.2, cls:'BAL',  decl:[12,34,61]},
  {id:'mass_assault',     name:'Mass Assault',      pts:8, seen:44,  resid:-2.3, cls:'SDD',  decl:[55,61,70]},
];
const RESID_FLAG = 2.0;         // MISPRICE_RESID_PTS
const CAP = 72;                 // DECK_POINTS_CAP — the one hard rule
const DECK_PTS = 72;            // current build sits at cap
const CLS_LABEL = {DOM:'Dominant',WDOM:'Weakly-dom',BAL:'Balanced',WDD:'Weakly-dd',SDD:'Strictly-dd'};
const CLS_KEY   = {DOM:'dom',WDOM:'wdom',BAL:'bal',WDD:'wdd',SDD:'sdd'};

// balance anchors: [key, current, target(baseline), lo, hi, unit]
const METRICS = [
  {k:'First-mover', cur:51, tgt:47, lo:44, hi:53, u:'%'},
  {k:'Red win',     cur:49, tgt:49, lo:46, hi:52, u:'%'},
  {k:'HQ endings',  cur:19, tgt:17, lo:10, hi:40, u:'%'},
  {k:'Tie→2nd',     cur:15, tgt:13, lo:8,  hi:20, u:'%'},
  {k:'Drag',        cur:2.7,tgt:2.4,lo:1.8,hi:3.2,u:''},
  {k:'Swings',      cur:3.6,tgt:3.5,lo:2.8,hi:4.4,u:''},
  {k:'Control',     cur:91, tgt:93, lo:85, hi:99, u:'%'},
];
// temperature profile: per-axis grace class (#83)
const TEMP = {name:'T1 · card-dev', axes:[
  {k:'win%',   g:'nudge'}, {k:'HQ%', g:'hold'}, {k:'Drag', g:'bold'},
  {k:'Swings', g:'bold'},  {k:'resid', g:'nudge'}, {k:'cap', g:'bypass'},
]};
// the proposed one-weight move (a SHARED step-weight, not a single card)
const MOVE = {
  step:'deploy', from:6, to:7, dir:'tighten',
  evidence:['Deploy Cavalry','Raiding Party','Entrench'],
  meanResid:1.3, klass:'WDOM',
  velocity:0.62,           // soft accept gauge 0..1
  projDeckPts:75,          // > CAP → the hard gate bites
};
const REDESIGN = [
  {name:'Conscription', why:'single-card dominator (resid +2.6, decline 4/9/15%) — redesign, never a weight move'},
  {name:'Mass Assault', why:'strictly-dominated + mispriced (resid −2.3, declined 55–70%)'},
];
const QUESTIONNAIRE = [
  {id:'feel',    text:'Did the match feel fair, or lopsided from the opening?'},
  {id:'reflex',  text:'Where were your plays real choices vs. reflex / only-legal-move?'},
  {id:'arc',     text:'Name the turn the game tipped, if it did.'},
  {id:'blind',   text:'Any moment the AI seemed to miss something you could see? (blind-spot flag)'},
];

/* ---------------- shared render helpers ---------------- */
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const sign = (n)=> (n>0?'+':'')+n;
function bandFill(m){ // position within band, colour by in/out
  const span=m.hi-m.lo, p=Math.max(0,Math.min(1,(m.cur-m.lo)/span));
  const out = m.cur<m.lo||m.cur>m.hi;
  const drift = Math.abs(m.cur-m.tgt) > span*0.28;
  const col = out?'var(--crit)':drift?'var(--nudge)':'var(--good)';
  return {p,col,out,drift};
}
function declBars(decl){
  if(!decl) return '<span class="muted mono" style="font-size:11px">always</span>';
  return `<span class="decl" title="decline-rate Open/Mid/Late">`+
    decl.map(v=>`<i style="height:${Math.max(2,v/72*16)}px"></i>`).join('')+
    `</span> <span class="mono muted" style="font-size:11px">${decl.join('/')}</span>`;
}
function cardTable(opts={}){
  const editable = opts.editableTarget;
  const rows = CARDS.map(c=>{
    const flag = Math.abs(c.resid)>=RESID_FLAG;
    const rc = c.resid>0?'pos':'neg';
    return `<tr class="${flag?'flag':''}">
      <td class="l"><span class="cardname">${c.name}</span>${flag?' <span class="pill crit">⚠ mispriced</span>':''}</td>
      <td class="num">${c.pts}</td>
      <td class="num">${c.seen}%</td>
      <td class="num ${rc}">${sign(c.resid)}</td>
      <td><span class="cls ${CLS_KEY[c.cls]}">${CLS_LABEL[c.cls]}</span></td>
      <td class="l">${declBars(c.decl)}</td>
    </tr>`;
  }).join('');
  return `<div class="tableScroll"><table>
    <thead><tr>
      <th class="l">Card</th><th>pts</th><th>seen</th><th>resid</th>
      <th class="l">class</th><th class="l">decline · O/M/L</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}
function capMeter(pts){
  const over = pts>CAP, p=Math.min(1,pts/ (Math.max(pts,CAP)) );
  return `<div class="cap ${over?'over':'ok'}"><i style="width:${p*100}%"></i></div>
    <div class="mono" style="font-size:12px;margin-top:5px">
      deckPoints <b>${pts}</b> / ${CAP} ${over?'<span class="pill crit">✗ over cap</span>':'<span class="pill good">✓ legal</span>'}</div>`;
}
function tempStrip(){
  const gcol={hold:'var(--ink-2)',nudge:'var(--nudge)',bold:'var(--accent-ink)',bypass:'var(--crit)'};
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">`+TEMP.axes.map(a=>
    `<span class="pill" style="color:${gcol[a.g]}">${a.k}·${a.g}</span>`).join('')+`</div>`;
}
function moveCard(){
  const over = MOVE.projDeckPts>CAP;
  return `<div class="card" style="padding:16px">
    <div class="eyebrow">proposed · one weight, one lever</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin:6px 0 2px">
      <h2 style="font-size:19px">↑ <span class="mono">${MOVE.step}</span> step-weight</h2>
      <span class="mono" style="font-size:18px">${MOVE.from}→${MOVE.to}</span>
      <span class="pill accent">${MOVE.dir}</span>
    </div>
    <p class="muted" style="margin:8px 0 12px">Shared-weight move: driven by a <b>${CLS_LABEL[MOVE.klass]}</b>
      capability class across ${MOVE.evidence.length} cards — mean resid <span class="pos mono">${sign(MOVE.meanResid)}</span>.
      Single-card dominators route to redesign, never here.</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
      ${MOVE.evidence.map(e=>`<span class="pill">${e}</span>`).join('')}
    </div>
    <div class="kv"><span class="k">Accept · soft velocity + direction</span>
      <span class="mono">${(MOVE.velocity*100)|0}% · within ${TEMP.name}</span></div>
    <div class="band" style="margin:6px 0 12px"><i style="width:${MOVE.velocity*100}%;background:var(--accent)"></i></div>
    <div class="kv"><span class="k">Projected deckPoints</span>
      <span class="mono ${over?'neg':'pos'}">72→${MOVE.projDeckPts} ${over?'✗ breaks cap':'✓'}</span></div>
    ${over?`<p class="pill crit" style="margin-top:10px">The 72 cap is the one hard rule — this move forces a trim before it can land.</p>`:''}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn good">Accept move</button>
      <button class="btn ghost">Simulate</button>
      <button class="btn crit ghost">Reject</button>
    </div>
  </div>`;
}
function redesignList(){
  return `<div class="card" style="padding:16px">
    <div class="eyebrow">redesign flags · not weight moves</div>
    ${REDESIGN.map(r=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <b>${r.name}</b><div class="muted" style="font-size:12.5px">${r.why}</div></div>`).join('')}
  </div>`;
}
function leverKickoff(compact){
  return `<div class="card" style="padding:16px">
    <div class="eyebrow">content-loop kickoff · one lever at a time</div>
    <p class="muted" style="margin:8px 0 10px">Pick the one content kind this run iterates. The rest are <b>held fixed</b>.</p>
    <div class="lever" id="leverPick">
      <label class="sel"><input type="radio" name="lv" checked onchange="pickLever(this)"> Card <span class="muted">· step-weights + deck</span></label>
      <label><input type="radio" name="lv" onchange="pickLever(this)"> Map <span class="muted">· roster + terrain</span></label>
      <label><input type="radio" name="lv" onchange="pickLever(this)"> AI <span class="muted">· personality panel</span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="col"><div class="kv"><span class="k">Deck</span><span class="mono">cavsplit17-raid-paid</span></div>
        <div class="kv hold"><span class="k">Map-set</span><span class="mono">core7 · held</span></div>
        <div class="kv hold"><span class="k">AI panel</span><span class="mono">brawler·turtle·hawk · held</span></div>
        <div class="kv"><span class="k">Temperature</span><span class="mono">${TEMP.name}</span></div>
      </div>
      <div class="col">
        <div class="barnote" style="margin-bottom:6px">Post-match debrief questionnaire (LLM playtester · #85)</div>
        ${QUESTIONNAIRE.map(q=>`<div class="qitem"><span class="mono">${q.id}</span>
          <input type="text" value="${q.text}"></div>`).join('')}
        <button class="btn ghost" style="margin-top:8px;font-size:12px">+ add question</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:16px">
      <button class="btn primary">▶ Launch iteration</button>
      <span class="barnote">100-skirmish hard-vs-hard sweep + 1 LLM feels-match · seed 1001</span>
    </div>
  </div>`;
}

/* ---------------- VARIANT A — Cockpit (everything at once) ---------------- */
function variantA(){
  const metrics = METRICS.map(m=>{
    const b=bandFill(m), d=+(m.cur-m.tgt).toFixed(1);
    const dc = Math.abs(d)<0.05?'muted':(b.out||b.drift?'neg':'pos');
    return `<div class="metric">
      <span class="k">${m.k}</span>
      <span class="v">${m.cur}${m.u}</span>
      <span class="d ${dc}">${d===0?'on target':sign(d)+m.u+' vs '+m.tgt+m.u}</span>
      <div class="band"><i style="width:${b.p*100}%;background:${b.col}"></i></div>
    </div>`;
  }).join('');
  return `
  <div class="vhead">
    <div><div class="eyebrow">War of Attrition · calibration</div>
      <h1 style="font-size:26px">Cockpit</h1>
      <div class="sub">Every readout on one screen — current sweep against the committed baselines, the per-card table, the proposed weight move, and the loop trigger.</div></div>
    <div style="text-align:right"><div class="eyebrow">run</div>
      <div class="mono">hard-v-hard · n=100 · core7</div>
      <div class="mono muted" style="font-size:12px">2026-08-28 · vs 1.2 baselines</div></div>
  </div>

  <div class="grid-metrics" style="margin-bottom:16px">${metrics}</div>

  <div class="row" style="align-items:flex-start">
    <div class="col" style="flex:2.2">
      <section class="card blk">
        <div class="blkhead"><h2>Per-card diagnosis</h2>
          <span class="eyebrow">resid ±${RESID_FLAG} flags · decline from #89</span></div>
        ${cardTable()}
      </section>
    </div>
    <div class="col" style="flex:1.3;display:flex;flex-direction:column;gap:14px">
      ${moveCard()}
      <div class="card" style="padding:16px">
        <div class="eyebrow">fairness temperature · ${TEMP.name}</div>
        <div style="margin:10px 0">${tempStrip()}</div>
        <div class="barnote">grace per axis · balanceScore stays temperature-independent (#83)</div>
      </div>
      ${redesignList()}
    </div>
  </div>

  <section class="card blk" style="margin-top:16px">${leverKickoff()}</section>
  <p class="barnote" style="margin-top:10px">Target adjustment (A): baseline chips above are the anchor — <b>click a delta to override its target</b> for this loop.</p>`;
}

/* ---------------- VARIANT B — Guided loop (one lever at a time) ---------------- */
let bStep=0;
const B_STEPS=['Read','Diagnose','Propose','Assemble & launch'];
function variantB(){
  const panes = [readPane(), diagnosePane(), proposePane(), assemblePane()];
  return `
  <div class="vhead">
    <div><div class="eyebrow">War of Attrition · calibration</div>
      <h1 style="font-size:26px">Guided loop</h1>
      <div class="sub">The one-lever-at-a-time loop as four steps: read the run, diagnose the cards, weigh the single proposed move, then assemble and fire the next iteration.</div></div>
  </div>
  <div class="steps">${B_STEPS.map((s,i)=>`<div class="st ${i===bStep?'on':''} ${i<bStep?'done':''}" onclick="setStep(${i})">
    <div class="n">step ${i+1}</div><div class="t">${s}</div></div>`).join('')}</div>
  <div id="bpanes">${panes.map((p,i)=>`<div class="stepPane ${i===bStep?'on':''}">${p}</div>`).join('')}</div>
  <div style="display:flex;gap:10px;margin-top:18px;justify-content:space-between">
    <button class="btn ghost" onclick="setStep(${Math.max(0,bStep-1)})" ${bStep===0?'disabled':''}>‹ back</button>
    <button class="btn primary" onclick="setStep(${Math.min(3,bStep+1)})">${bStep===3?'▶ Launch iteration':'next ›'}</button>
  </div>`;
}
function readPane(){
  const metrics = METRICS.map(m=>{
    const b=bandFill(m), d=+(m.cur-m.tgt).toFixed(1);
    return `<div><div class="kv"><span class="k">${m.k}</span>
      <span class="mono">${m.cur}${m.u} <span class="muted">/ tgt ${m.tgt}${m.u}</span>
      <span class="pill ${b.out?'crit':b.drift?'nudge':'good'}">${b.out?'out':b.drift?'drift':'in-band'}</span></span></div>
      <div class="band"><i style="width:${b.p*100}%;background:${b.col}"></i></div></div>`;
  }).join('');
  return `<section class="card blk"><div class="blkhead"><h2>Read the run against the baselines</h2>
    <span class="eyebrow">n=100 · core7 · vs 1.2</span></div>
    <div style="display:grid;gap:12px">${metrics}</div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <div class="eyebrow" style="margin-bottom:8px">fairness temperature · ${TEMP.name}</div>${tempStrip()}</div>
  </section>`;
}
function diagnosePane(){
  return `<section class="card blk"><div class="blkhead"><h2>Diagnose the cards</h2>
    <span class="eyebrow">capability class + decline · sort resid</span></div>
    ${cardTable()}
    <p class="muted" style="margin-top:12px">Two cards route to <b>redesign</b>, not the weight lever: ${REDESIGN.map(r=>r.name).join(', ')}.</p>
  </section>`;
}
function proposePane(){
  return `<div class="row" style="align-items:flex-start">
    <div class="col" style="flex:1.4">${moveCard()}</div>
    <div class="col">${redesignList()}</div></div>`;
}
function assemblePane(){ return leverKickoff(); }

/* ---------------- VARIANT C — Proposal review (calibration as a PR) ---------------- */
function variantC(){
  const over=MOVE.projDeckPts>CAP;
  const checks=[
    {ic:'pass',lbl:`Capability-class signal — ${MOVE.evidence.length} cards, ${CLS_LABEL[MOVE.klass]}, mean resid ${sign(MOVE.meanResid)}`},
    {ic:'pass',lbl:`Direction — ${MOVE.dir}, soft velocity ${(MOVE.velocity*100)|0}% within ${TEMP.name}`},
    {ic:'failic',lbl:`Hard cap — projected deckPoints 72→${MOVE.projDeckPts} exceeds ${CAP} (blocking; needs a trim)`},
    {ic:'warnic',lbl:`Redesign flags untouched — Conscription (dominator), Mass Assault (strictly-dd)`},
    {ic:'pass',lbl:`LLM feels-pass — no fairness veto (advisory, never feeds the math)`},
  ];
  return `
  <div class="vhead">
    <div><div class="eyebrow">War of Attrition · calibration · proposal #<span class="mono">c-0417</span></div>
      <h1 style="font-size:24px">↑ deploy step-weight 6→7</h1>
      <div class="sub">Each iteration is a reviewable change: the before/after baselines, the checks it must pass, and the card table as the “files changed.”</div></div>
    <div style="display:flex;gap:8px"><button class="btn good">✓ Approve &amp; launch</button>
      <button class="btn crit ghost">Request changes</button></div>
  </div>

  <section class="card blk"><div class="blkhead"><h2>Baselines · before → after (simulated)</h2>
    <span class="eyebrow">edit ‘after’ to retarget</span></div>
    <div class="diffgrid">
      <div class="before"><div class="eyebrow" style="color:var(--crit)">current run</div>
        ${METRICS.slice(0,5).map(m=>`<div class="kv"><span class="k">${m.k}</span><span class="mono">${m.cur}${m.u}</span></div>`).join('')}</div>
      <div class="after"><div class="eyebrow" style="color:var(--good)">target after move · editable</div>
        ${METRICS.slice(0,5).map(m=>`<div class="kv"><span class="k">${m.k}</span>
          <span><input class="tgt" value="${m.tgt}"><span class="muted mono">${m.u}</span></span></div>`).join('')}</div>
    </div>
  </section>

  <section class="card blk"><div class="blkhead"><h2>Checks</h2>
    <span class="eyebrow">${over?'1 blocking':'all clear'}</span></div>
    ${checks.map(c=>`<div class="checkrow"><span class="ic ${c.ic}">${c.ic==='pass'?'✓':c.ic==='warnic'?'△':'✗'}</span>
      <span>${c.lbl}</span></div>`).join('')}
  </section>

  <section class="card blk"><div class="blkhead"><h2>Files changed · per-card table</h2>
    <span class="eyebrow">${CARDS.filter(c=>Math.abs(c.resid)>=RESID_FLAG).length} mispriced</span></div>
    ${cardTable()}
  </section>

  <section class="card blk">${leverKickoff()}
    <p class="barnote" style="margin-top:12px">Target adjustment (C): retarget by editing the ‘after’ column above — the diff shows the move against your revised anchor.</p>
  </section>`;
}

/* ---------------- switcher / plumbing ---------------- */
const VARIANTS={A:{name:'Cockpit',fn:variantA},B:{name:'Guided loop',fn:variantB},C:{name:'Proposal review',fn:variantC}};
const ORDER=['A','B','C'];
function curVar(){const p=new URLSearchParams(location.search).get('variant');return VARIANTS[p]?p:'A';}
function render(){
  const v=curVar();
  document.getElementById('app').innerHTML=VARIANTS[v].fn();
  document.getElementById('swlabel').innerHTML=`<b>${v}</b> · ${VARIANTS[v].name}`;
}
function goVar(v){const u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);render();}
function cycle(d){const i=ORDER.indexOf(curVar());goVar(ORDER[(i+d+3)%3]);}
function setStep(i){bStep=i;render();}
function pickLever(el){[...document.querySelectorAll('#leverPick label')].forEach(l=>l.classList.remove('sel'));
  el.closest('label').classList.add('sel');}
function toggleTheme(){const r=document.documentElement;
  const cur=r.getAttribute('data-theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');}
addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);});
render();
</script>
