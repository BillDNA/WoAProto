<title>Iteration Workbench</title>
<!-- PROTOTYPE — throwaway. Wayfinder #91, v2 (rebuilt on Bill's steer):
     a CONTENT-ITERATION tool, not a balance report. Three phases: Plan → Run → Results.
     Switch phase with the bottom bar or ?phase=plan|run|results. Mock data — NOT a live run. -->
<style>
  :root{
    --paper:#f4f3ec; --card:#fbfaf5; --sunk:#efeee5; --ink:#1b1d17; --ink-2:#4a4d40; --ink-3:#8a8c7c;
    --line:#dedbcd; --line-2:#cbc8b6;
    --accent:#3f6d8a; --accent-ink:#2c556e; --accent-wash:#3f6d8a18;
    --good:#4e7a4a; --good-wash:#4e7a4a1f;
    --nudge:#b8851f; --nudge-wash:#c8922a22;
    --crit:#a8432f; --crit-wash:#a8432f1c;
    --live:#3f6d8a;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --disp:'Archivo','IBM Plex Sans',system-ui,sans-serif;
    --r:9px; --shadow:0 1px 2px #1b1d1710,0 6px 20px #1b1d1708;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#14150f; --card:#1c1e16; --sunk:#191b13; --ink:#eceadb; --ink-2:#a7a898; --ink-3:#71735f;
      --line:#2c2e23; --line-2:#3a3c2f;
      --accent:#78aecb; --accent-ink:#9cc6de; --accent-wash:#78aecb1c;
      --good:#8bc286; --good-wash:#8bc28620;
      --nudge:#e0ad4a; --nudge-wash:#e0ad4a22;
      --crit:#e08066; --crit-wash:#e0806622;
      --live:#78aecb;
      --shadow:0 1px 2px #0006,0 8px 24px #0004;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14150f; --card:#1c1e16; --sunk:#191b13; --ink:#eceadb; --ink-2:#a7a898; --ink-3:#71735f;
    --line:#2c2e23; --line-2:#3a3c2f;
    --accent:#78aecb; --accent-ink:#9cc6de; --accent-wash:#78aecb1c;
    --good:#8bc286; --good-wash:#8bc28620;
    --nudge:#e0ad4a; --nudge-wash:#e0ad4a22;
    --crit:#e08066; --crit-wash:#e0806622;
    --live:#78aecb;
    --shadow:0 1px 2px #0006,0 8px 24px #0004;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:78px}
  h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;font-weight:640;letter-spacing:-.01em}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 24px}
  button{font-family:var(--sans);cursor:pointer}
  a{color:var(--accent-ink)}
  .muted{color:var(--ink-2)} .barnote{font-family:var(--mono);font-size:11px;color:var(--ink-2)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
    padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
  .pill.good{color:var(--good);background:var(--good-wash);border-color:transparent}
  .pill.nudge{color:var(--nudge);background:var(--nudge-wash);border-color:transparent}
  .pill.crit{color:var(--crit);background:var(--crit-wash);border-color:transparent}
  .pill.accent{color:var(--accent-ink);background:var(--accent-wash);border-color:transparent}
  .btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:7px;font-size:13px;font-weight:560}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0e1410}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.crit{border-color:var(--crit);color:var(--crit)} .btn.good{border-color:var(--good);color:var(--good)}
  .btn.big{padding:11px 20px;font-size:14px}

  .vhead{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .vhead .sub{color:var(--ink-2);font-size:13px;max-width:60ch;margin-top:5px}
  .sectlabel{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
  .sectlabel h2{font-size:15px} .sectlabel .eyebrow{margin-left:auto}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:none} .kv .k{color:var(--ink-2)}
  .hold{opacity:.5}
  .row{display:flex;gap:16px;flex-wrap:wrap} .col{flex:1;min-width:270px}

  /* PLAN: loop-type chooser */
  .looptypes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .lt{border:1.5px solid var(--line-2);border-radius:var(--r);padding:15px;cursor:pointer;background:var(--card);transition:.12s}
  .lt:hover{border-color:var(--accent)}
  .lt.on{border-color:var(--accent);background:var(--accent-wash)}
  .lt .ic{font-size:20px;line-height:1}
  .lt h3{font-size:15px;margin:8px 0 3px}
  .lt p{margin:0;font-size:12px;color:var(--ink-2)}
  .lt .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}

  .nudge-in{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-family:var(--sans);font-size:14px;padding:11px 13px;resize:vertical;min-height:64px}
  .nudge-in:focus{outline:2px solid var(--accent);border-color:transparent}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .chip{font-size:12px;padding:4px 11px;border-radius:999px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2)}
  .chip:hover{border-color:var(--accent);color:var(--accent-ink)}

  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .seg button{background:var(--card);border:none;padding:7px 14px;font-family:var(--mono);font-size:12px;color:var(--ink-2);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .seg button.on,:root:not([data-theme="light"]) .seg button.on{color:#0e1410}

  .graceaxes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .qitem{display:flex;gap:9px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .qitem .mono{flex:none;color:var(--ink-2);width:52px}
  .qitem input{flex:1;background:transparent;border:none;color:var(--ink);font:inherit}
  .qitem input:focus{outline:none;border-bottom:1px solid var(--accent)}

  /* RUN */
  .livedot{width:9px;height:9px;border-radius:50%;background:var(--live);display:inline-block;
    box-shadow:0 0 0 0 var(--live);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #3f6d8a66}70%{box-shadow:0 0 0 8px #3f6d8a00}100%{box-shadow:0 0 0 0 #3f6d8a00}}
  @media (prefers-reduced-motion:reduce){.livedot{animation:none}}
  .bigstat{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
  .prog{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
  .prog>i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .logtail{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    font-family:var(--mono);font-size:12px;line-height:1.7;max-height:210px;overflow:auto}
  .logtail .t{color:var(--ink-3)} .logtail .ok{color:var(--good)} .logtail .hl{color:var(--accent-ink)}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .statgrid>div{background:var(--card);padding:13px 15px}
  .statgrid .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
  .statgrid .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:3px}

  /* RESULTS — content gallery */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
  .summary>div{background:var(--card);padding:15px 16px}
  .summary .big{font-family:var(--mono);font-size:24px;font-weight:600}
  .summary .lab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-top:2px}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  /* game card face */
  .gcard{border:1px solid var(--line-2);border-radius:11px;background:linear-gradient(180deg,var(--card),var(--sunk));
    padding:13px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
  .gcard .verdict{position:absolute;top:0;right:0;font-family:var(--mono);font-size:10px;padding:3px 9px;border-bottom-left-radius:8px;text-transform:uppercase;letter-spacing:.06em}
  .verdict.keep{background:var(--good-wash);color:var(--good)}
  .verdict.cut{background:var(--crit-wash);color:var(--crit)}
  .verdict.iter{background:var(--nudge-wash);color:var(--nudge)}
  .gcard .top{display:flex;align-items:center;gap:8px;padding-right:56px}
  .gcard .cost{font-family:var(--mono);font-weight:700;font-size:15px;background:var(--ink);color:var(--paper);
    width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
  .gcard .nm{font-family:var(--disp);font-weight:640;font-size:15px;line-height:1.1}
  .gcard .type{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
  .gcard .txt{font-size:12.5px;color:var(--ink-2);min-height:34px}
  .gcard .diff{font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent-wash);border-radius:6px;padding:5px 8px}
  .gcard .ev{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
  .gcard .ev .m{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .gcard .ev .m b{color:var(--ink)}
  .new-badge{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:4px;letter-spacing:.06em}
  :root[data-theme="dark"] .new-badge,:root:not([data-theme="light"]) .new-badge{color:#0e1410}

  /* map thumb */
  .mapcard{border:1px solid var(--line-2);border-radius:11px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
  .mapthumb{background:var(--sunk);display:grid;place-items:center;padding:12px;border-bottom:1px solid var(--line)}
  .mapmeta{padding:12px 13px;display:flex;flex-direction:column;gap:7px}
  .mapmeta .nm{font-family:var(--disp);font-weight:640;font-size:15px}

  /* heuristics table */
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line-2);font-weight:500}
  th.l,td.l{text-align:left}
  td{padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .arrow{color:var(--ink-3)} .up{color:var(--good)} .down{color:var(--crit)}
  .tableScroll{overflow-x:auto}

  /* phase switcher (bottom bar) */
  #switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;background:var(--ink);color:var(--paper);border-radius:999px;padding:5px 6px;box-shadow:0 8px 30px #0003,0 2px 6px #0004}
  #switch button{background:transparent;border:none;color:var(--paper);opacity:.6;padding:7px 16px;border-radius:999px;font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
  #switch button:hover{opacity:.85} #switch button.on{opacity:1;background:#ffffff1f}
  #switch button.on b{color:#fff}
  #switch .step{font-family:var(--mono);opacity:.35;font-size:12px}
  #themeBtn{position:fixed;right:18px;top:18px;z-index:50}
</style>

<button class="btn ghost" id="themeBtn" onclick="toggleTheme()">◐ theme</button>
<div class="wrap" id="app"></div>

<div id="switch">
  <button data-p="plan" onclick="goPhase('plan')"><b>1</b> Plan</button>
  <span class="step">→</span>
  <button data-p="run" onclick="goPhase('run')"><b>2</b> Run</button>
  <span class="step">→</span>
  <button data-p="results" onclick="goPhase('results')"><b>3</b> Results</button>
</div>

<script>
/* ================= mock data (grounded shapes; NOT a live run) ================= */
const RUN = {loop:'Card loop', nudge:'Reward committing to an early cavalry push — the midgame feels too safe.',
  deck:'cavsplit17-raid-paid', mapset:'core7', panel:'brawler · turtle · hawk',
  temp:'T1 · card-dev', tol:'T1', started:'09:12', iter:4, iters:6, skirm:1740, skirmTotal:6000};

const QUESTIONNAIRE = [
  {id:'feel',   text:'Did the match feel fair, or lopsided from the opening?'},
  {id:'reflex', text:'Where were your plays real choices vs. reflex / only-legal-move?'},
  {id:'arc',    text:'Name the turn the game tipped, if it did.'},
  {id:'blind',  text:'Anything the AI seemed to miss that you could see? (blind-spot flag)'},
];
const GRACE = [
  {k:'win%',g:'nudge'},{k:'HQ%',g:'hold'},{k:'Drag',g:'bold'},{k:'Swings',g:'bold'},{k:'resid',g:'nudge'},{k:'cap',g:'bypass'}];

// content the loop BUILT this iteration
const BUILT_CARDS = [
  {nm:'Flanking Order', cost:6, type:'maneuver', isNew:true, verdict:'keep',
   txt:'Move a Cavalry unit up to 2 hexes; if it ends adjacent to an enemy, it attacks free.',
   diff:'NEW — drafted to reward the early push', ev:[['resid','+0.7'],['win','54%'],['seen','61%']]},
  {nm:'Raiding Party', cost:6, type:'maneuver', isNew:false, verdict:'iter',
   txt:'Deploy a Cavalry unit behind enemy lines; it cannot be reinforced this turn.',
   diff:'TUNED — added “free reposition” clause; cost 5→6', ev:[['resid','+1.1→+0.4'],['win','58%→52%'],['seen','55%']]},
  {nm:'Reckless Maneuvers', cost:4, type:'maneuver', isNew:false, verdict:'keep',
   txt:'Move any two units; each ends its move exposed (−1 defense this round).',
   diff:'HELD — sits in-band, kept as control', ev:[['resid','-0.3'],['win','48%'],['seen','40%']]},
  {nm:'Mass Assault', cost:8, type:'attack', isNew:false, verdict:'cut',
   txt:'All adjacent units attack the same enemy hex simultaneously.',
   diff:'CUT — strictly-dominated, declined 55–70%', ev:[['resid','-2.3'],['win','43%'],['seen','44%']]},
];
const BUILT_MAPS = [
  {nm:'Split Ford', shape:'river', verdict:'keep', drag:2.5, swings:3.8, note:'two crossings force a commit'},
  {nm:'The Pinch', shape:'choke', verdict:'iter', drag:3.1, swings:2.6, note:'too grindy — Drag over band'},
];
// heuristic numbers the loop tuned (AI_WEIGHTS keys, real)
const HEURISTICS = [
  {key:'advance',   who:'hawk',    from:2.2, to:2.9},
  {key:'hqGuard',   who:'turtle',  from:4,   to:5.5},
  {key:'threatKill',who:'brawler', from:6,   to:6, note:'held'},
  {key:'fallbackBias',who:'hawk',  from:12,  to:9},
  {key:'trenchHome',who:'turtle',  from:6,   to:7.5},
];

/* ================= helpers ================= */
function graceStrip(){
  const c={hold:'var(--ink-2)',nudge:'var(--nudge)',bold:'var(--accent-ink)',bypass:'var(--crit)'};
  return '<div class="graceaxes">'+GRACE.map(a=>`<span class="pill" style="color:${c[a.g]}">${a.k}·${a.g}</span>`).join('')+'</div>';
}
function hexThumb(kind){ // stylized pointy-top hex cluster, HQ dots + terrain hint
  const W=150,H=118,r=13,dx=r*Math.sqrt(3),dy=r*1.5;
  let cells=[];
  for(let row=0;row<5;row++)for(let col=0;col<4;col++){
    const x=18+col*dx+(row%2?dx/2:0), y=16+row*dy;
    if((row===0&&col===3)||(row===4&&col===0))continue; // ragged edge
    cells.push({x,y,row,col});
  }
  const hexPath=(cx,cy)=>{let p='';for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90);p+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)+' ';}return p+'Z';};
  const terr = kind==='river'
    ? c=>((c.col===1&&c.row>0)?'var(--accent-wash)':null)
    : c=>((c.col===1||c.col===2)&&c.row===2?'var(--nudge-wash)':null);
  const hexes=cells.map(c=>`<path d="${hexPath(c.x,c.y)}" fill="${terr(c)||'var(--card)'}" stroke="var(--line-2)" stroke-width="1"/>`).join('');
  const hq=[cells[0],cells[cells.length-1]];
  const dots=`<circle cx="${hq[0].x}" cy="${hq[0].y}" r="5" fill="var(--crit)"/><circle cx="${hq[1].x}" cy="${hq[1].y}" r="5" fill="var(--accent)"/>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="map outline">${hexes}${dots}</svg>`;
}
const vpill={keep:['keep','keep'],cut:['cut','cut'],iter:['iter','iterate']};

/* ================= PHASE 1 — PLAN ================= */
function planPhase(){
  const lt=(id,ic,nm,desc,tag,on)=>`<div class="lt ${on?'on':''}" onclick="pickLoop(this)"><div class="ic">${ic}</div>
    <h3>${nm}</h3><p>${desc}</p><div class="tag" style="margin-top:8px">${tag}</div></div>`;
  return `
  <div class="vhead"><div><div class="eyebrow">War of Attrition · iteration workbench</div>
    <h1 style="font-size:26px">Plan the iteration</h1>
    <div class="sub">Pick the one content kind this loop iterates, point it with an opening nudge, tune the accept settings and the playtester's questionnaire — then hand it to the machine.</div></div></div>

  <div class="sectlabel"><h2>1 · What does this loop build?</h2><span class="eyebrow">one lever · the rest held fixed</span></div>
  <div class="looptypes">
    ${lt('card','🃏','Card loop','Draft / tune cards under the 72-pt cap.','builds cards',true)}
    ${lt('map','⬡','Map loop','Carve maps to fill a roster gap.','builds maps',false)}
    ${lt('ai','◆','AI loop','Tune heuristic personality weights.','builds personalities',false)}
  </div>

  <div class="row" style="margin-top:20px">
    <div class="col card pad">
      <div class="eyebrow">2 · Opening nudge</div>
      <p class="muted" style="margin:6px 0 10px">A directional steer the drafter/search starts from. Optional, but this is where your taste enters the loop.</p>
      <textarea class="nudge-in">${RUN.nudge}</textarea>
      <div class="chips">
        <button class="chip">+ more aggression</button><button class="chip">+ reward defense</button>
        <button class="chip">+ open the midgame</button><button class="chip">+ punish greed</button></div>
    </div>
    <div class="col card pad">
      <div class="eyebrow">Held fixed this run</div>
      <div style="margin-top:8px">
        <div class="kv"><span class="k">Deck</span><span class="mono">${RUN.deck}</span></div>
        <div class="kv hold"><span class="k">Map-set</span><span class="mono">${RUN.mapset}</span></div>
        <div class="kv hold"><span class="k">AI panel</span><span class="mono">${RUN.panel}</span></div>
        <div class="kv hold"><span class="k">Rules</span><span class="mono">1.2 · golden</span></div>
      </div>
    </div>
  </div>

  <div class="row" style="margin-top:16px">
    <div class="col card pad">
      <div class="eyebrow">3 · Tolerance · how wide the accept-bands sit</div>
      <div style="margin:12px 0 6px" class="seg">
        <button>T0 · strict</button><button class="on">T1 · normal</button><button>T2 · loose</button></div>
      <p class="barnote">Widens the pass/fail bands the grader applies to a result.</p>
    </div>
    <div class="col card pad">
      <div class="eyebrow">Temperature · per-axis grace + step size</div>
      <div style="margin:12px 0 4px" class="seg">
        <button>T0</button><button class="on">card-dev</button><button>T2</button><button>custom…</button></div>
      ${graceStrip()}
      <p class="barnote" style="margin-top:8px">Loosens the axes this lever is allowed to move; balanceScore stays fixed (#83).</p>
    </div>
  </div>

  <div class="card pad" style="margin-top:16px">
    <div class="eyebrow">4 · Playtester debrief · asked after every skirmish (#85)</div>
    <div style="margin-top:8px">${QUESTIONNAIRE.map(q=>`<div class="qitem"><span class="mono">${q.id}</span><input value="${q.text}"></div>`).join('')}
      <button class="btn ghost" style="margin-top:9px;font-size:12px">+ add question</button></div>
  </div>

  <div style="display:flex;gap:12px;align-items:center;margin-top:20px">
    <button class="btn primary big" onclick="goPhase('run')">▶ Launch on the machine</button>
    <span class="barnote">100-skirmish sweep × 6 iterations + 1 LLM feels-match per candidate · seed 1001</span>
  </div>`;
}

/* ================= PHASE 2 — RUN ================= */
function runPhase(){
  const pct=(RUN.skirm/RUN.skirmTotal*100);
  const log=[
    ['09:41','iter 4/6 · drafted','<span class="hl">Flanking Order</span> (6pt) — sweeping…'],
    ['09:38','iter 4/6 · candidate','Raiding Party +free-reposition, cost 5→6'],
    ['09:33','iter 3/6 · <span class="ok">kept</span>','Split Ford — Drag 2.5, Swings 3.8 ✓ in-band'],
    ['09:27','iter 3/6 · feels-match','“early push felt committal, not forced” ✓'],
    ['09:19','iter 2/6 · <span class="ok">cut</span>','Mass Assault — declined 55–70%, resid −2.3'],
    ['09:12','iter 1/6 · start','loop armed · nudge locked · rules 1.2 golden'],
  ];
  return `
  <div class="vhead"><div><div class="eyebrow">War of Attrition · iteration workbench</div>
    <h1 style="font-size:26px" style="display:flex;align-items:center;gap:10px"><span class="livedot"></span> Loop running on the machine</h1>
    <div class="sub"><b>${RUN.loop}</b> · nudged “${RUN.nudge}”</div></div>
    <div style="display:flex;gap:8px"><button class="btn ghost">⏸ pause</button><button class="btn crit">■ stop</button></div></div>

  <div class="card pad" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:flex-end">
      <div><div class="eyebrow">iteration</div><div class="bigstat">${RUN.iter} <span class="muted" style="font-size:18px">/ ${RUN.iters}</span></div></div>
      <div><div class="eyebrow">skirmishes swept</div><div class="bigstat">${RUN.skirm.toLocaleString()} <span class="muted" style="font-size:18px">/ ${RUN.skirmTotal.toLocaleString()}</span></div></div>
      <div><div class="eyebrow">elapsed · eta</div><div class="mono" style="font-size:16px">29 min · ~24 min left</div></div>
      <div style="text-align:right"><div class="eyebrow">running best</div><div class="mono" style="font-size:15px;color:var(--good)">Flanking Order · +0.7 resid</div></div>
    </div>
    <div class="prog" style="margin-top:14px"><i style="width:${pct}%"></i></div>
    <div class="barnote" style="margin-top:6px">${pct.toFixed(0)}% · currently sweeping candidate <b>Flanking Order</b> across ${RUN.mapset}</div>
  </div>

  <div class="statgrid" style="margin-bottom:16px">
    <div><div class="k">built so far</div><div class="v">2 kept · 1 cut</div></div>
    <div><div class="k">first-mover (live)</div><div class="v">50%</div></div>
    <div><div class="k">Drag (live)</div><div class="v">2.6</div></div>
    <div><div class="k">feels-veto</div><div class="v" style="color:var(--good)">none</div></div>
  </div>

  <div class="sectlabel"><h2>Live log</h2><span class="eyebrow">tail · newest first</span></div>
  <div class="logtail">${log.map(l=>`<div><span class="t">${l[0]}</span> &nbsp;${l[1]} — ${l[2]}</div>`).join('')}</div>
  <p class="barnote" style="margin-top:12px">Leave it; it writes every skirmish to <span class="mono">logs/woa.db</span> and lands a report in phase 3 when done. Come back whenever.</p>`;
}

/* ================= PHASE 3 — RESULTS ================= */
function resultsPhase(){
  const cardEl=c=>{const [vk,vl]=vpill[c.verdict];return `<div class="gcard">
    <div class="verdict ${vk}">${vl}</div>
    <div class="top"><div class="cost">${c.cost}</div><div><div class="nm">${c.nm} ${c.isNew?'<span class="new-badge">new</span>':''}</div><div class="type">${c.type}</div></div></div>
    <div class="txt">${c.txt}</div>
    <div class="diff">${c.diff}</div>
    <div class="ev">${c.ev.map(m=>`<span class="m">${m[0]} <b>${m[1]}</b></span>`).join('')}</div>
  </div>`;};
  const mapEl=m=>{const [vk,vl]=vpill[m.verdict];const dragOver=m.drag>3.0;return `<div class="mapcard">
    <div class="mapthumb">${hexThumb(m.shape)}</div>
    <div class="mapmeta"><div style="display:flex;justify-content:space-between;align-items:center">
      <span class="nm">${m.nm}</span><span class="pill ${vk==='keep'?'good':vk==='cut'?'crit':'nudge'}">${vl}</span></div>
      <div class="muted" style="font-size:12.5px">${m.note}</div>
      <div style="display:flex;gap:8px"><span class="pill ${dragOver?'crit':'good'}">Drag ${m.drag}</span><span class="pill">Swings ${m.swings}</span></div>
    </div></div>`;};
  const heurRows=HEURISTICS.map(h=>{const d=h.to-h.from;const cls=h.note?'':(d>0?'up':d<0?'down':'');
    return `<tr><td class="l mono">${h.key}</td><td class="l">${h.who}</td><td class="num mono">${h.from}</td>
      <td class="arrow">→</td><td class="num mono ${cls}">${h.note?'held':h.to}</td>
      <td class="num mono ${cls}">${h.note?'—':(d>0?'+':'')+d.toFixed(1)}</td></tr>`;}).join('');
  return `
  <div class="vhead"><div><div class="eyebrow">War of Attrition · iteration workbench</div>
    <h1 style="font-size:26px">Results · iteration review</h1>
    <div class="sub"><b>${RUN.loop}</b> · nudged “${RUN.nudge}” · finished 10:05 — the shared surface for you + the review session.</div></div>
    <div style="display:flex;gap:8px"><button class="btn">↻ Re-run with edits</button><button class="btn ghost">open balance report ↗</button></div></div>

  <div class="summary">
    <div><div class="big">1</div><div class="lab">card added</div></div>
    <div><div class="big">1</div><div class="lab">card tuned</div></div>
    <div><div class="big">1</div><div class="lab">card cut</div></div>
    <div><div class="big">1</div><div class="lab">map added</div></div>
    <div><div class="big">5</div><div class="lab">weights tuned</div></div>
    <div><div class="big" style="color:var(--good)">✓</div><div class="lab">stayed in-band</div></div>
  </div>

  <div class="sectlabel"><h2>Cards built</h2><span class="eyebrow">design first · measured evidence beneath</span></div>
  <div class="gallery">${BUILT_CARDS.map(cardEl).join('')}</div>

  <div class="sectlabel"><h2>Maps built</h2><span class="eyebrow">outline + feel read</span></div>
  <div class="gallery" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${BUILT_MAPS.map(mapEl).join('')}</div>

  <div class="sectlabel"><h2>Heuristic numbers</h2><span class="eyebrow">AI_WEIGHTS · per personality · before → after</span></div>
  <div class="card pad"><div class="tableScroll"><table>
    <thead><tr><th class="l">weight</th><th class="l">personality</th><th>from</th><th></th><th>to</th><th>Δ</th></tr></thead>
    <tbody>${heurRows}</tbody></table></div>
    <p class="barnote" style="margin-top:10px">These are the levers the AI loop moved — the personalities the built content was measured against.</p>
  </div>

  <p class="barnote" style="margin-top:16px">The full balance report is one click away (top-right) — this surface leads with <b>what got built</b> so you and the reviewer discuss the same artifacts, not a metrics dump.</p>`;
}

/* ================= plumbing ================= */
const PHASES={plan:planPhase,run:runPhase,results:resultsPhase};
function curPhase(){const p=new URLSearchParams(location.search).get('phase');return PHASES[p]?p:'plan';}
function render(){
  const p=curPhase();
  document.getElementById('app').innerHTML=PHASES[p]();
  document.querySelectorAll('#switch button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  scrollTo(0,0);
}
function goPhase(p){const u=new URL(location);u.searchParams.set('phase',p);history.replaceState(null,'',u);render();}
function pickLoop(el){el.parentElement.querySelectorAll('.lt').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
function toggleTheme(){const r=document.documentElement;
  const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');}
addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const o=['plan','run','results'],i=o.indexOf(curPhase());
  if(e.key==='ArrowLeft')goPhase(o[(i+2)%3]); if(e.key==='ArrowRight')goPhase(o[(i+1)%3]);});
render();
</script>
